overrides:
  immutable: '>=4.3.9 <5'
  nanoid: '>=3.3.17 <4'
  undici: '^7.29.0'
  "parse-link-header": "^2.0.0"
  "uuid": "^11.1.1"
  # GHSA-mrwp-f3q8-3g9p, GHSA-q3jh-wrc6-jgq8, GHSA-8r9p-f939-6h3c
  follow-redirects: '>=1.16.2 <2'
  # GHSA-6pq8-jhm2-2vcw
  qs: '>=6.16.1 <7'
  # GHSA-477h-4r7f-fvrx
  pbkdf2: '>=3.1.7 <4'

# Web-only app. Skip isomorphic-webcrypto's React Native optional deps so
# Expo (and its vulnerable glob, minimatch, and zod) is not installed.
ignoredOptionalDependencies:
  - expo-random
  - "@unimodules/core"
  - "@unimodules/react-native-adapter"
  - react-native-securerandom

allowBuilds:
  esbuild: true
  msgpackr-extract: true
